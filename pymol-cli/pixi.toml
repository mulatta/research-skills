[workspace]
name = "pymol-cli"
version = "0.1.0"
description = "Cross-platform development environment for pymol-cli"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[dependencies]
python = "3.14.*"
pymol-open-source = "3.1.*"

[pypi-dependencies]
pymol-cli = { path = ".", editable = true }

[feature.dev.dependencies]
hatchling = "*"
mypy = "*"
nodejs = "*"
pytest = "*"
python-build = "*"
ruff = "*"

[feature.dev.tasks]
build = "python -m build"
format = "ruff format pymol_cli tests"
format-check = "ruff format --check pymol_cli tests"
lint = "ruff check pymol_cli tests"
smoke-cli = "pymol-cli launch --dry-run"
test = "python -m pytest tests"
typecheck = "mypy pymol_cli"
check = { depends-on = ["format-check", "lint", "typecheck", "test", "smoke-cli"] }

[environments]
default = { features = ["dev"] }
